<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Sarabun, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <!-- site zones -->
  <g font-size="15" font-weight="700">
    <rect x="20" y="20" width="290" height="420" rx="14" fill="#eef6f1" stroke="#9cc9ad"/>
    <text x="36" y="46" fill="#1f6b3f">Branch-A · Local AAA</text>
    <rect x="330" y="20" width="340" height="420" rx="14" fill="#eef2fb" stroke="#9fb3e0"/>
    <text x="346" y="46" fill="#23408e">HQ · TACACS+</text>
    <rect x="690" y="20" width="290" height="420" rx="14" fill="#fbf1ea" stroke="#e2b493"/>
    <text x="706" y="46" fill="#8a4316">Branch-C · RADIUS</text>
  </g>

  <!-- links -->
  <g stroke="#3a3f4b" stroke-width="2.5" fill="none">
    <line x1="165" y1="112" x2="165" y2="196"/>
    <line x1="165" y1="226" x2="165" y2="300"/>
    <line x1="420" y1="112" x2="485" y2="196"/>
    <line x1="580" y1="112" x2="515" y2="196"/>
    <line x1="500" y1="226" x2="500" y2="300"/>
    <line x1="765" y1="112" x2="820" y2="196"/>
    <line x1="905" y1="112" x2="850" y2="196"/>
    <line x1="835" y1="226" x2="835" y2="300"/>
  </g>
  <g stroke="#c2410c" stroke-width="3" fill="none">
    <path d="M195 325 L470 325" />
    <path d="M530 325 L805 325" />
  </g>

  <!-- hosts -->
  <g font-size="13" text-anchor="middle">
    <rect x="130" y="70" width="70" height="42" rx="6" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.6"/>
    <text x="165" y="96" font-weight="700">PC-A</text>
    <text x="165" y="62" fill="#4b5563">.1.3 · acad:1::3</text>

    <rect x="385" y="70" width="70" height="42" rx="6" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.6"/>
    <text x="420" y="96" font-weight="700">PC-B</text>
    <text x="420" y="62" fill="#4b5563">.2.3 · acad:2::3</text>

    <rect x="530" y="64" width="100" height="48" rx="6" fill="#dbe4fb" stroke="#23408e" stroke-width="1.8"/>
    <text x="580" y="86" font-weight="700" fill="#23408e">TACACS+</text>
    <text x="580" y="103" fill="#23408e">Server</text>
    <text x="580" y="58" fill="#4b5563">.2.2 · acad:2::2</text>

    <rect x="730" y="70" width="70" height="42" rx="6" fill="#ffffff" stroke="#3a3f4b" stroke-width="1.6"/>
    <text x="765" y="96" font-weight="700">PC-C</text>
    <text x="765" y="62" fill="#4b5563">.3.3 · acad:3::3</text>

    <rect x="855" y="64" width="100" height="48" rx="6" fill="#f7ddc9" stroke="#8a4316" stroke-width="1.8"/>
    <text x="905" y="86" font-weight="700" fill="#8a4316">RADIUS</text>
    <text x="905" y="103" fill="#8a4316">Server</text>
    <text x="905" y="58" fill="#4b5563">.3.2 · acad:3::2</text>
  </g>

  <!-- switches -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="130" y="196" width="70" height="30" rx="5" fill="#475569"/>
    <text x="165" y="216">S1</text>
    <rect x="465" y="196" width="70" height="30" rx="5" fill="#475569"/>
    <text x="500" y="216">S2</text>
    <rect x="800" y="196" width="70" height="30" rx="5" fill="#475569"/>
    <text x="835" y="216">S3</text>
  </g>
  <g font-size="11.5" fill="#4b5563">
    <text x="173" y="188">F0/2</text>
    <text x="173" y="246">F0/1</text>
    <text x="458" y="188" text-anchor="end">F0/1</text>
    <text x="542" y="188">F0/6</text>
    <text x="508" y="246">F0/2</text>
    <text x="793" y="188" text-anchor="end">F0/18</text>
    <text x="877" y="188">F0/1</text>
    <text x="843" y="246">F0/5</text>
  </g>

  <!-- routers -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="165" cy="325" r="30" fill="#1f6b3f"/>
    <text x="165" y="331">R1</text>
    <circle cx="500" cy="325" r="30" fill="#23408e"/>
    <text x="500" y="331">R2</text>
    <circle cx="835" cy="325" r="30" fill="#8a4316"/>
    <text x="835" y="331">R3</text>
  </g>
  <g font-size="12" fill="#1f2937">
    <text x="174" y="282">G0/1 .1</text>
    <text x="509" y="282">G0/0 .1</text>
    <text x="844" y="282">G0/1 .1</text>
  </g>

  <!-- WAN labels -->
  <g font-size="12" text-anchor="middle" fill="#9a3412">
    <text x="332" y="312">S0/0/0 (DCE) .2 ── .1 S0/0/0</text>
    <text x="332" y="350">10.1.1.0/30</text>
    <text x="332" y="366">2001:db8:acad:12::/64</text>
    <text x="668" y="312">S0/0/1 (DCE) .1 ── .2 S0/0/1</text>
    <text x="668" y="350">10.2.2.0/30</text>
    <text x="668" y="366">2001:db8:acad:23::/64</text>
  </g>

  <!-- LAN labels -->
  <g font-size="12.5" text-anchor="middle" fill="#1f2937">
    <text x="165" y="384">192.168.1.0/24</text>
    <text x="165" y="401">2001:db8:acad:1::/64</text>
    <text x="165" y="420" fill="#1f6b3f">fe80::1 · Admin1</text>
    <text x="500" y="384">192.168.2.0/24</text>
    <text x="500" y="401">2001:db8:acad:2::/64</text>
    <text x="500" y="420" fill="#23408e">fe80::2 · tacacs+ → local</text>
    <text x="835" y="384">192.168.3.0/24</text>
    <text x="835" y="401">2001:db8:acad:3::/64</text>
    <text x="835" y="420" fill="#8a4316">fe80::3 · radius → local</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#374151">
    <line x1="30" y1="478" x2="70" y2="478" stroke="#c2410c" stroke-width="3"/>
    <text x="78" y="482">Serial WAN (dual-stack, static routes)</text>
    <line x1="350" y1="478" x2="390" y2="478" stroke="#3a3f4b" stroke-width="2.5"/>
    <text x="398" y="482">Ethernet LAN</text>
    <text x="520" y="482">IPv6 prefix ย่อ: acad:N:: = 2001:db8:acad:N::</text>
    <text x="30" y="506">AAA ทุกตัวคุยกับเซิร์ฟเวอร์ผ่าน IPv4 · การจัดการอุปกรณ์ใช้ SSH v2 เท่านั้น · ผู้ใช้สำรองอยู่ใน local database</text>
  </g>
</svg>
