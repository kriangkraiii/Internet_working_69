hostname R0-ISP
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
security passwords min-length 8
clock timezone ICT 7 0
ip domain-name kku.lab
no ip domain-lookup
no ip http server
no ip http secure-server
file prompt quiet
!
! ---------- AAA (local) ----------
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username admin privilege 15 secret Cisco123!
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
! ---------- SSH + VTY (Extended ACL จำกัดเฉพาะ mgmt subnet) ----------
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip access-list extended ACL-MGMT-SSH
 permit tcp any any eq 22
 remark ** allow SSH only from OOB management subnet **
 permit tcp 10.10.20.0 0.0.0.255 any eq 22
 deny   ip any any log
line vty 0 4
 access-class ACL-MGMT-SSH in
 transport input ssh
 exec-timeout 10 0
 logging synchronous
line con 0
 exec-timeout 15 0
 logging synchronous
!
banner motd # *** R0-ISP | KKU Capstone P3 | Authorized access only - all activity is logged *** #
!
! ---------- Management interface (OOB) ----------
interface GigabitEthernet0/3
 description OOB-MGMT
 ip address 10.10.20.181 255.255.255.0
 no shutdown
!
! ---------- Syslog ----------
logging buffered 64000 debugging
logging source-interface GigabitEthernet0/3
logging trap informational
logging host 10.10.20.50
archive
 log config
  logging enable
  notify syslog contenttype plaintext
  hidekeys
!
! ---------- NTP (authenticated) ----------
ntp authentication-key 1 md5 NtpKey#2569
ntp trusted-key 1
ntp authenticate
ntp source GigabitEthernet0/3
ntp master 3
!
! ---------- SNMPv3 (authPriv, จำกัดด้วย ACL) ----------
ip access-list standard ACL-SNMP
 permit 10.10.20.50
 deny   any log
snmp-server view V3-VIEW iso included
snmp-server group SNMPV3-GRP v3 priv read V3-VIEW access ACL-SNMP
snmp-server user snmpadmin SNMPV3-GRP v3 auth sha SnmpAuth#2569 priv aes 128 SnmpPriv#2569
snmp-server location R0-ISP-GNS3
snmp-server contact capstone@kku.lab
snmp-server enable traps snmp linkdown linkup
snmp-server enable traps config
snmp-server host 10.10.20.50 version 3 priv snmpadmin
!
ip route 10.10.0.0 255.255.0.0 10.10.20.254
ip route 192.168.0.0 255.255.0.0 10.10.20.254
!
ipv6 unicast-routing
interface GigabitEthernet0/0
 description to R1-HQ
 ip address 203.0.113.2 255.255.255.252
 ipv6 address 2001:db8:ffff:1::2/64
 no shutdown
interface GigabitEthernet0/1
 description to R2-BR1
 ip address 203.0.113.6 255.255.255.252
 ipv6 address 2001:db8:ffff:2::2/64
 no shutdown
interface GigabitEthernet0/2
 description to R3-DC
 ip address 203.0.113.10 255.255.255.252
 ipv6 address 2001:db8:ffff:3::2/64
 no shutdown
