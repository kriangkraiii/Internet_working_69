lab:
  description: CP353301 Capstone Group 9 - Ansible + EEM automation demo (R1, R2 IOSv; Ubuntu control node)
  notes: |-
    CP353301 Capstone - Group 9 - Automation demo
    1. Check the two external connectors: sandbox-bridge = System Bridge (bridge0), internet-nat = NAT.
    2. Make sure 10.10.20.190 is free on the sandbox network, then start the lab.
    3. Wait ~5 minutes, then from the Mac (VPN connected): ssh grp9@10.10.20.190  (password Grp9@lab)
    4. cat /etc/grp9-ready  ->  READY
    5. cd ~/lab/ansible && ansible-playbook precheck.yml -J   (vault password: grp9lab)
  title: grp9-automation-demo
  version: 0.1.0
links:
  - id: l0
    n1: n0
    n2: n2
    i1: i1
    i2: i0
    label: R1-Gi0/0<->SW-MGMT-port0
  - id: l1
    n1: n1
    n2: n2
    i1: i1
    i2: i1
    label: R2-Gi0/0<->SW-MGMT-port1
  - id: l2
    n1: n3
    n2: n2
    i1: i0
    i2: i2
    label: automation-host-mgmt0<->SW-MGMT-port2
  - id: l3
    n1: n0
    n2: n1
    i1: i2
    i2: i2
    label: R1-Gi0/1<->R2-Gi0/1
  - id: l4
    n1: n3
    n2: n4
    i1: i1
    i2: i0
    label: automation-host-sbx0<->sandbox-bridge
  - id: l5
    n1: n3
    n2: n5
    i1: i2
    i2: i0
    label: automation-host-inet0<->internet-nat
nodes:
  - boot_disk_size: 0
    configuration: |-
      ! R1 — Day-0 configuration (IOSv 15.9 on Cisco Modeling Labs)
      ! Applied automatically at first boot when the lab YAML is imported.
      hostname R1
      !
      no ip domain lookup
      ip domain name lab.local
      !
      username admin privilege 15 secret Cisco@123
      !
      service timestamps log datetime msec
      logging buffered 64000
      logging host 192.168.100.10
      !
      interface GigabitEthernet0/0
       description MGMT to SW-MGMT
       ip address 192.168.100.11 255.255.255.0
       no shutdown
      !
      interface GigabitEthernet0/1
       description P2P to R2 (configured by Ansible)
       no ip address
       shutdown
      !
      archive
       log config
        logging enable
        notify syslog contenttype plaintext
        hidekeys
      !
      crypto key generate rsa modulus 2048
      ip ssh version 2
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 15
       exec-timeout 30 0
       logging synchronous
       login local
       transport input ssh
      !
      end
    cpu_limit: 100
    cpus: 1
    data_volume: 0
    hide_links: false
    id: n0
    label: R1
    node_definition: iosv
    ram: 512
    tags: []
    x: -200
    y: 160
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i2
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i3
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i4
        label: GigabitEthernet0/3
        slot: 3
        type: physical
  - boot_disk_size: 0
    configuration: |-
      ! R2 — Day-0 configuration (IOSv 15.9 on Cisco Modeling Labs)
      ! Applied automatically at first boot when the lab YAML is imported.
      hostname R2
      !
      no ip domain lookup
      ip domain name lab.local
      !
      username admin privilege 15 secret Cisco@123
      !
      service timestamps log datetime msec
      logging buffered 64000
      logging host 192.168.100.10
      !
      interface GigabitEthernet0/0
       description MGMT to SW-MGMT
