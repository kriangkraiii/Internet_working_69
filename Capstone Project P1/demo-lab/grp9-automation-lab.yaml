    cpu_limit: 100
    cpus: 1
    data_volume: 0
    hide_links: false
    id: n1
    label: R2
    node_definition: iosv
    ram: 512
    tags: []
    x: 200
    y: 160
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i2
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i3
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i4
        label: GigabitEthernet0/3
        slot: 3
        type: physical
  - id: n2
    label: SW-MGMT
    node_definition: unmanaged_switch
    x: 0
    y: 0
    configuration: ''
    tags: []
    interfaces:
      - id: i0
        label: port0
        slot: 0
        type: physical
      - id: i1
        label: port1
        slot: 1
        type: physical
      - id: i2
        label: port2
        slot: 2
        type: physical
      - id: i3
        label: port3
        slot: 3
        type: physical
      - id: i4
        label: port4
        slot: 4
        type: physical
      - id: i5
        label: port5
        slot: 5
        type: physical
      - id: i6
        label: port6
        slot: 6
        type: physical
      - id: i7
        label: port7
        slot: 7
        type: physical
  - id: n3
    label: automation-host
    node_definition: ubuntu
    x: 0
    y: -180
    configuration: |-
      #cloud-config
      hostname: automation-host
      manage_etc_hosts: true
      ssh_pwauth: true
      users:
        - default
        - name: grp9
          gecos: Group 9 automation user
          groups: [adm, sudo]
          shell: /bin/bash
          sudo: 'ALL=(ALL) NOPASSWD:ALL'
          lock_passwd: false
          plain_text_passwd: 'Grp9@lab'
      write_files:
        - path: /usr/local/sbin/grp9-net.sh
          permissions: '0755'
          content: |
            #!/bin/bash
            # Give the three NICs stable names by PCI order:
            #   slot 0 -> mgmt0 (SW-MGMT, 192.168.100.10)
            #   slot 1 -> sbx0  (DevNet sandbox bridge, reachable from the VPN)
            #   slot 2 -> inet0 (CML NAT, internet for apt/pip)
            set -euo pipefail
            mapfile -t NICS < <(
              for d in /sys/class/net/*; do
                [ -e "$d/device" ] || continue
                pci=$(readlink -f "$d/device" | grep -oE '[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]' | tail -1)
                echo "$pci $(basename "$d")"
              done | sort | awk '{print $2}')
            mac() { cat "/sys/class/net/$1/address"; }
            {
              echo "network:"
              echo "  version: 2"
              echo "  ethernets:"
              echo "    mgmt0:"
              echo "      match: {macaddress: \"$(mac "${NICS[0]}")\"}"
              echo "      set-name: mgmt0"
              echo "      addresses: [192.168.100.10/24]"
              if [ -n "${NICS[1]:-}" ]; then
                echo "    sbx0:"
                echo "      match: {macaddress: \"$(mac "${NICS[1]}")\"}"
                echo "      set-name: sbx0"
                echo "      addresses: [10.10.20.190/24]"
                echo "      nameservers: {addresses: [8.8.8.8, 1.1.1.1]}"
                echo "      routes:"
                echo "        - {to: 10.0.0.0/8, via: 10.10.20.254}"
                echo "        - {to: 172.16.0.0/12, via: 10.10.20.254}"
                echo "        - {to: 192.168.0.0/16, via: 10.10.20.254}"
              fi
              if [ -n "${NICS[2]:-}" ]; then
                echo "    inet0:"
                echo "      match: {macaddress: \"$(mac "${NICS[2]}")\"}"
                echo "      set-name: inet0"
                echo "      dhcp4: true"
              fi
            } > /etc/netplan/60-grp9.yaml
            chmod 600 /etc/netplan/60-grp9.yaml
            rm -f /etc/netplan/50-cloud-init.yaml
            netplan apply
        - path: /usr/local/sbin/grp9-setup.sh
          permissions: '0755'
          content: |
            #!/bin/bash
            # One-time setup of the Ansible control node (runs from cloud-init).
            exec > >(tee -a /var/log/grp9-setup.log) 2>&1
            set -x
            /usr/local/sbin/grp9-net.sh
            systemctl restart rsyslog

            # Wait for internet via NAT; fall back to the sandbox gateway.
            for i in $(seq 1 30); do curl -s -m 5 -o /dev/null https://pypi.org && break; sleep 2; done
            if ! curl -s -m 5 -o /dev/null https://pypi.org; then
              ip route replace default via 10.10.20.254 dev sbx0 || true
            fi

            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y python3-venv python3-pip netcat-openbsd tcpdump
            python3 -m venv /opt/ansible
            /opt/ansible/bin/pip install --upgrade pip
            /opt/ansible/bin/pip install ansible-core "paramiko<5"
            echo 'export PATH=/opt/ansible/bin:$PATH' > /etc/profile.d/ansible.sh
            # the image may ship its own /usr/bin/ansible; make sure the venv wins in every shell
            echo 'export PATH=/opt/ansible/bin:$PATH' >> /home/grp9/.bashrc

            install -d -o grp9 -g grp9 /home/grp9/lab /home/grp9/.ssh
            cp -r /opt/grp9-lab/. /home/grp9/lab/
            mv /home/grp9/lab/ssh_config /home/grp9/.ssh/config
            chmod 600 /home/grp9/.ssh/config
            chown -R grp9:grp9 /home/grp9
            sudo -u grp9 -H /opt/ansible/bin/ansible-galaxy collection install -r /home/grp9/lab/ansible/requirements.yml

            if /opt/ansible/bin/ansible --version >/dev/null 2>&1 && \
               [ -d /home/grp9/.ansible/collections/ansible_collections/cisco/ios ]; then
              echo "READY $(date)" > /etc/grp9-ready
            else
              echo "SETUP FAILED - see /var/log/grp9-setup.log" > /etc/grp9-ready
            fi
            cat /etc/grp9-ready
        - path: /etc/rsyslog.d/10-network.conf
          permissions: '0644'
          content: |
            module(load="imudp")
            input(type="imudp" port="514" ruleset="network")
            ruleset(name="network") {
              action(type="omfile" file="/var/log/network.log" fileCreateMode="0644")
            }
        - path: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
          permissions: '0644'
          content: |
            network: {config: disabled}
        - path: /etc/motd
          permissions: '0644'
          content: |

              grp9 automation host  (CP353301 Capstone demo)
              -------------------------------------------------
              cat /etc/grp9-ready        -> READY when setup finished
              cd ~/lab/ansible           -> Ansible project (vault password: grp9lab)
              ssh r1 / ssh r2            -> routers (admin / Cisco@123)
              tail -f /var/log/network.log -> syslog from R1/R2
        - path: /opt/grp9-lab/ssh_config
          permissions: '0600'
          content: |
            Host r1
              HostName 192.168.100.11
            Host r2
              HostName 192.168.100.12
            Host r1 r2
              User admin
              KexAlgorithms +diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
              HostKeyAlgorithms +ssh-rsa
              PubkeyAcceptedAlgorithms +ssh-rsa
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
        - path: /opt/grp9-lab/ansible/ansible.cfg
          permissions: '0644'
          content: |
            [defaults]
            inventory = inventory.yml
            host_key_checking = False
            retry_files_enabled = False
            timeout = 30

            [persistent_connection]
            connect_timeout = 30
            command_timeout = 60
        - path: /opt/grp9-lab/ansible/inventory.yml
          permissions: '0644'
          content: |
            all:
              children:
                routers:
                  hosts:
                    R1: {ansible_host: 192.168.100.11,
                         rid: 1.1.1.1, p2p_ip: 10.12.12.1}
                    R2: {ansible_host: 192.168.100.12,
                         rid: 2.2.2.2, p2p_ip: 10.12.12.2}
                  vars:
                    ansible_connection: ansible.netcommon.network_cli
                    ansible_network_os: cisco.ios.ios
                    ansible_user: admin
                    ansible_password: "{{ vault_admin_pw }}"
        - path: /opt/grp9-lab/ansible/site.yml
          permissions: '0644'
          content: |
            - name: Deploy OSPF area 0
              hosts: routers
              gather_facts: false
              tasks:
                - name: L3 interfaces (resource module)
                  cisco.ios.ios_l3_interfaces:
                    state: merged
                    config:
                      - {name: Loopback0, ipv4: [{address: "{{ rid }}/32"}]}
                      - {name: GigabitEthernet0/1,
                         ipv4: [{address: "{{ p2p_ip }}/30"}]}
                - name: Enable Gi0/1 (idempotent no shutdown)
                  cisco.ios.ios_interfaces:
                    state: merged
                    config: [{name: GigabitEthernet0/1, enabled: true}]
                - name: OSPF process 1
                  cisco.ios.ios_config:
                    parents: router ospf 1
                    lines:
                      - router-id {{ rid }}
                      - network 10.12.12.0 0.0.0.3 area 0
                      - network {{ rid }} 0.0.0.0 area 0
                - name: Verify adjacency is FULL
                  cisco.ios.ios_command:
                    commands: show ip ospf neighbor
                    wait_for: result[0] contains FULL
                    retries: 12
                    interval: 5
                  when: not ansible_check_mode
        - path: /opt/grp9-lab/ansible/precheck.yml
          permissions: '0644'
          content: |
            # Run before presenting: proves SSH + credentials work on every router.
            - name: Pre-check router access
              hosts: routers
              gather_facts: false
              tasks:
                - name: Log in and run a show command
                  cisco.ios.ios_command:
                    commands: show version | include uptime
                  register: ver

                - name: Print uptime
                  ansible.builtin.debug:
                    msg: "{{ ver.stdout_lines[0][0] }}"
        - path: /opt/grp9-lab/ansible/verify.yml
          permissions: '0644'
          content: |
            # Optional: collect the same evidence shown on slide 14 without logging in to each router.
            - name: Verify OSPF state
              hosts: routers
              gather_facts: false
              tasks:
                - name: Collect OSPF neighbor and routes
                  cisco.ios.ios_command:
                    commands:
                      - show ip ospf neighbor
                      - show ip route ospf
                  register: out

                - name: Show results
                  ansible.builtin.debug:
                    var: out.stdout_lines
        - path: /opt/grp9-lab/ansible/reset.yml
          permissions: '0644'
          content: |
            # Rehearsal helper: return both routers to the pre-demo state so site.yml shows changed=3 again.
            - name: Reset lab to pre-demo state
              hosts: routers
              gather_facts: false
              tasks:
                - name: Remove OSPF process 1
                  cisco.ios.ios_ospfv2:
                    state: deleted
                    config:
                      processes:
                        - process_id: 1

                - name: Remove IPv4 addresses from Loopback0 and Gi0/1
                  cisco.ios.ios_l3_interfaces:
                    state: deleted
                    config:
                      - name: Loopback0
                      - name: GigabitEthernet0/1

                - name: Shut down Gi0/1
                  cisco.ios.ios_interfaces:
                    state: merged
                    config: [{name: GigabitEthernet0/1, enabled: false}]
        - path: /opt/grp9-lab/ansible/requirements.yml
          permissions: '0644'
          content: |
            collections:
              - name: cisco.ios
              - name: ansible.netcommon
        - path: /opt/grp9-lab/ansible/group_vars/routers/vars.yml
          permissions: '0644'
          content: |
            # Use paramiko for network_cli (works with the SSH algorithms of IOSv 15.9
            # and avoids the "ansible-pylibssh not installed" warning during the demo).
            ansible_network_cli_ssh_type: paramiko
        - path: /opt/grp9-lab/ansible/group_vars/routers/vault.yml
          permissions: '0644'
          content: |
            $ANSIBLE_VAULT;1.1;AES256
            35393033646465653030666338356462653038613330633733336536336639316233366537306236
            6634393932613031653331376364636564326532313862330a633335373530336337383633613464
            62323564356366653739653463323164336466616432336330623165393439376461613866376330
            3737303139643766310a306664623130346365633466613035373663633132333962623664623930
            32383638353837623537333064373065376666366364663161343165373366646334
        - path: /opt/grp9-lab/configs/R1-day0.cfg
          permissions: '0644'
          content: |
            ! R1 — Day-0 configuration (IOSv 15.9 on Cisco Modeling Labs)
            ! Applied automatically at first boot when the lab YAML is imported.
            hostname R1
            !
            no ip domain lookup
            ip domain name lab.local
            !
            username admin privilege 15 secret Cisco@123
            !
            service timestamps log datetime msec
            logging buffered 64000
            logging host 192.168.100.10
            !
            interface GigabitEthernet0/0
             description MGMT to SW-MGMT
             ip address 192.168.100.11 255.255.255.0
             no shutdown
            !
            interface GigabitEthernet0/1
             description P2P to R2 (configured by Ansible)
             no ip address
             shutdown
            !
            archive
             log config
              logging enable
              notify syslog contenttype plaintext
              hidekeys
            !
            crypto key generate rsa modulus 2048
            ip ssh version 2
            !
            line con 0
             exec-timeout 0 0
             logging synchronous
            line vty 0 15
             exec-timeout 30 0
             logging synchronous
             login local
             transport input ssh
            !
            end
        - path: /opt/grp9-lab/configs/R2-day0.cfg
          permissions: '0644'
          content: |
            ! R2 — Day-0 configuration (IOSv 15.9 on Cisco Modeling Labs)
            ! Applied automatically at first boot when the lab YAML is imported.
            hostname R2
            !
            no ip domain lookup
            ip domain name lab.local
            !
            username admin privilege 15 secret Cisco@123
            !
            service timestamps log datetime msec
            logging buffered 64000
            logging host 192.168.100.10
            !
            interface GigabitEthernet0/0
             description MGMT to SW-MGMT
             ip address 192.168.100.12 255.255.255.0
             no shutdown
            !
            interface GigabitEthernet0/1
             description P2P to R1 (configured by Ansible)
             no ip address
             shutdown
            !
            archive
             log config
              logging enable
              notify syslog contenttype plaintext
              hidekeys
            !
            crypto key generate rsa modulus 2048
            ip ssh version 2
            !
            line con 0
             exec-timeout 0 0
             logging synchronous
            line vty 0 15
             exec-timeout 30 0
             logging synchronous
             login local
             transport input ssh
            !
            end
        - path: /opt/grp9-lab/configs/R1-eem.cfg
          permissions: '0644'
          content: |
            ! Demo 2 — paste into R1 in global configuration mode (configure terminal)
            ! Saves OSPF evidence to flash and raises a critical syslog when a neighbor drops from FULL.
            event manager applet OSPF-NBR-DOWN
             event syslog pattern "OSPF-5-ADJCHG.*FULL to DOWN" ratelimit 60 maxrun 60
             action 1.0 cli command "enable"
             action 1.5 cli command "delete /force flash0:ospf-ev.txt"
             action 2.0 cli command "show ip ospf neighbor | redirect flash0:ospf-ev.txt"
             action 2.5 wait 6
             action 3.0 cli command "show ip route ospf | append flash0:ospf-ev.txt"
             action 4.0 syslog priority critical msg "OSPF nbr lost - evidence saved"
            end
      runcmd:
        - [bash, /usr/local/sbin/grp9-setup.sh]
      final_message: 'grp9 automation host finished cloud-init after $UPTIME seconds'
    cpus: 2
    ram: 2048
    tags: []
    interfaces:
      - id: i0
        label: ens2
        slot: 0
        type: physical
      - id: i1
        label: ens3
        slot: 1
        type: physical
      - id: i2
        label: ens4
        slot: 2
        type: physical
  - id: n4
    label: sandbox-bridge
    node_definition: external_connector
    x: -280
    y: -180
    configuration: bridge0
    tags: []
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical
  - id: n5
    label: internet-nat
    node_definition: external_connector
    x: 280
    y: -180
    configuration: virbr0
    tags: []
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical
